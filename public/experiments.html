<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><meta name="description" content="Interactive experiments from KAKAO."><title>Experiments — KAKAO</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head><body class="page-experiments"><div class="page-wipe" aria-hidden="true"></div><header class="site-header" data-site-header></header><main><section class="page-intro section-shell"><p class="mono" data-reveal>LAB · OPEN SOON</p><h1 data-reveal>Ideas need somewhere<br>to <em>misbehave.</em></h1><p data-reveal>This will be KAKAO’s public playground for interaction studies, prototypes and small useful oddities.</p></section><section class="experiment-field section-shell" aria-label="Interactive experimental canvas"><div class="experiment-orb" data-drag-orb tabindex="0" role="img" aria-label="A draggable KAKAO experiment object"><span>K</span><i></i></div><p class="mono">DRAG THE OBJECT · NO EXPERIMENTS PUBLISHED YET</p></section></main><footer class="site-footer" data-site-footer></footer><script type="module" src="/js/app.js"></script><script type="module">const orb=document.querySelector('[data-drag-orb]');let active=false,startX=0,startY=0,x=0,y=0;orb.addEventListener('pointerdown',e=>{active=true;startX=e.clientX-x;startY=e.clientY-y;orb.setPointerCapture(e.pointerId)});orb.addEventListener('pointermove',e=>{if(!active)return;x=e.clientX-startX;y=e.clientY-startY;const r=orb.parentElement.getBoundingClientRect();x=Math.max(-r.width*.38,Math.min(r.width*.38,x));y=Math.max(-r.height*.28,Math.min(r.height*.28,y));orb.style.transform=`translate3d(${x}px,${y}px,0) rotate(${x*.08}deg)`});orb.addEventListener('pointerup',()=>active=false);</script></body></html>
